name: flutter_barcode_scanner_animation
description: "Flutter package designed to enhance barcode scanning experiences by integrating seamless animations with live camera feed."
version: 0.0.1
homepage: https://github.com/horlengg/flutter_barcode_scanner_animation
repository: https://github.com/horlengg/flutter_barcode_scanner_animation
issue_tracker: https://github.com/horlengg/flutter_barcode_scanner_animation/issues


environment:
  sdk: ^3.9.2
  flutter: ">=1.17.0"

dependencies:
  camera: ^0.11.3+1
  flutter:
    sdk: flutter
  google_mlkit_barcode_scanning: ^0.14.2
  google_mlkit_commons: ^0.11.1
  image: ^4.7.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

